name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dépendances
        run: pip install -r requirements_test.txt
      - name: Ruff
        run: ruff check --select F,E9 custom_components tests
      - name: Tests
        run: pytest -q
