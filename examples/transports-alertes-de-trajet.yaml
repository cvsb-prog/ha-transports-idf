alias: Transports – alertes de trajet
description: >-
  Les jours travaillés, prévient la personne d'un trajet (sur ses téléphones
  uniquement) pendant la veille du trajet : ligne de l'itinéraire perturbée
  (correspondances comprises), retour à la normale, départ à avancer pour
  arriver à l'heure (ou retard à une étape), « pars à … » 10 min avant le
  départ conseillé, puis, en route, chaque nouvelle prévision d'arrivée. L'intégration Transports IDF envoie l'événement ; tout le reste est ici.
mode: queued
triggers:
  - trigger: event
    event_type: transports_idf_alerte
conditions:
  - condition: state
    entity_id: binary_sensor.workday_sensor
    state: "on"
actions:
  - variables:
      d: "{{ trigger.event.data }}"
      # Téléphones de la personne : ses traqueurs fournis par l'application compagnon.
      services: >-
        {% set ns = namespace(s=[]) %}
        {% for t in state_attr(d.personne, 'device_trackers') or [] %}
          {% set app = device_id(t) %}
          {% if app and 'mobile_app' in (device_attr(app, 'identifiers') or []) | map('first') | list %}
            {% set ns.s = ns.s + ['notify.mobile_app_' ~ (device_attr(app, 'name') | slugify)] %}
          {% endif %}
        {% endfor %}
        {{ ns.s | unique | list }}
      heure: >-
        {% set h = d.heure or d.heure_depart or '00:00' %}{{ h[:2] | int }} h {{ h[3:5] }}
      repere: "{{ ('arrivée ' if d.type_heure == 'arrivee' else 'départ ') ~ heure }}"
      c: "{{ d.conseil or {} }}"
      # Départ conseillé donné dans le message d'une perturbation (avant le départ).
      conseil_perturbation: "{{ d.type == 'perturbation' and c.depart_h and not c.impossible and not d.en_route }}"
      # Messages qui donnent eux-mêmes l'arrivée (en-tête « horaire ») : pas de répétition en pied.
      arrivee_dite: "{{ d.type in ['rappel_depart', 'prevision'] or conseil_perturbation }}"
      retard_arrivee: "{{ (d.ecarts or []) | select('match', 'arrivée ') | first | default('') }}"
      # En-tête court : « Arrivée 9 h 11 (58 min) · RER B · direct », ou « Arrivée 9 h 16 (+5 min) · … » en retard.
      horaire: >-
        {% if retard_arrivee %}{{ retard_arrivee[0] | upper ~ retard_arrivee[1:] }}{% else %}Arrivée {{ c.arrivee_h or d.arrivee_prevue }}{{ ' (' ~ c.duree_min ~ ' min)' if c.duree_min else '' }}{% endif %} · {{ c.parcours or c.resume }}
      ecarts_pied: "{{ (d.ecarts or []) | reject('match', 'arrivée ') | list if arrivee_dite else (d.ecarts or []) }}"
      titre: >-
        {% if d.type == 'perturbation' %}⚠️ {{ d.trajet }} ({{ repere }}) : perturbation
        {%- elif d.type == 'retour_normal' %}✅ {{ d.trajet }} ({{ repere }}) : trafic normal
        {%- elif d.type == 'rappel_depart' %}🚶 {{ d.trajet }} : pars à {{ c.depart_h }}
        {%- elif d.type == 'prevision' %}🔄 {{ d.trajet }} ({{ repere }}) : nouvelle prévision
        {%- elif c.impossible and d.ecarts %}⛔ {{ d.trajet }} : en retard — {{ d.ecarts | join(', ') }}
        {%- elif c.impossible %}⛔ {{ d.trajet }} : arrivée à {{ heure }} impossible
        {%- else %}⏰ {{ d.trajet }} : pars à {{ c.depart_h }} au plus tard{% endif %}
      message: |-
        {%- if d.type == 'perturbation' %}
        {%- for p in d.nouvelles %}
        {{ p.lignes_trajet | join(', ') }} — {{ p.titre }}
        {%- endfor %}
        {%- if d.perturbations | count > d.nouvelles | count %}
        ({{ d.perturbations | count }} perturbations en cours sur le trajet)
        {%- endif %}
        {%- if conseil_perturbation %}
        Pour arriver à {{ heure }} : pars à {{ c.depart_h }} au plus tard ({{ horaire[0] | lower ~ horaire[1:] }}).
        {%- elif d.rechange and d.rechange.texte %}
        Itinéraire de rechange ({{ d.rechange.depart_h ~ ' → ' ~ d.rechange.arrivee_h ~ ' · ' if d.rechange.depart_h and d.rechange.arrivee_h else '' }}{{ d.rechange.resume }}) :
        {{ d.rechange.texte }}
        {%- elif d.rechange and d.rechange.resume %}
        Rechange : {{ d.rechange.resume }}
        {%- endif %}
        {%- elif d.type == 'retour_normal' %}
        Plus aucune perturbation sur {{ d.itineraire }}.
        {%- elif d.type == 'rappel_depart' %}
        {{ horaire }}
        {{ c.texte }}
        {%- elif d.type == 'prevision' and c.impossible %}
        Aucun itinéraire ne permet plus d'aller au bout du trajet.
        {%- elif d.type == 'prevision' %}
        {{ horaire }}
        {%- elif c.impossible and d.ecarts %}
        Au mieux, en partant à {{ c.depart_h }} : {{ d.ecarts | join(', ') }}.
        {{ c.texte }}
        {%- elif c.impossible %}
        Aucun itinéraire ne permet plus d'arriver à {{ heure }}.
        {%- else %}
        Pour arriver à {{ heure }}, {{ c.avance }} min plus tôt que d'habitude (départ habituel {{ (d.depart_habituel[:2] | int) ~ ' h ' ~ d.depart_habituel[3:5] }}) :
        {{ c.texte }}
        {%- endif %}
        {#- Dans tous les cas : le retard prévu (destination et étapes), sinon l'arrivée prévue si le message ne la donne pas déjà. #}
        {%- if not (d.type == 'depart_anticipe' and c.impossible) %}
        {%- if ecarts_pied %}
        Retard prévu : {{ ecarts_pied | join(', ') }}.
        {%- elif d.arrivee_prevue and not arrivee_dite %}
        Arrivée prévue {{ d.arrivee_prevue }}{{ " (à l'heure)" if d.type_heure == 'arrivee' else '' }}.
        {%- endif %}
        {%- endif %}
  - if:
      - condition: template
        value_template: "{{ services | count == 0 }}"
    then:
      - action: persistent_notification.create
        data:
          title: "{{ titre }}"
          message: "{{ message }}\n(aucun téléphone trouvé pour {{ d.personne }})"
          notification_id: "transports_{{ d.sous_entree }}"
    else:
      - repeat:
          for_each: "{{ services }}"
          sequence:
            - action: "{{ repeat.item }}"
              continue_on_error: true
              data:
                title: "{{ titre }}"
                message: "{{ message }}"
                data:
                  tag: "transports_{{ d.sous_entree }}"
                  group: transports
                  channel: Transports
